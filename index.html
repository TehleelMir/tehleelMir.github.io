<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tehleel Mir</title>
  <meta name="description" content="Tehleel Mir — software developer.">
  <link href="img/apple-touch-icon.png" rel="apple-touch-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #ffffff;
      --fg: #111111;
      --muted: #8a8a8a;
      /* drop timing: start delay + duration; impact lands at 62% of the fall */
      --delay: .3s;
      --dur: 2.2s;
      --impact: calc(var(--delay) + var(--dur) * .62);
    }

    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      overflow-x: hidden;
    }

    main {
      text-align: center;
      max-width: 640px;
      width: 100%;
    }

    h1 {
      font-size: clamp(1.75rem, 5vw, 2.75rem);
      font-weight: 600;
      letter-spacing: -0.03em;
      line-height: 1.2;
    }

    h1 span { color: var(--muted); font-weight: 400; }

    /* ---------- Mic drop ---------- */

    .stage {
      position: relative;
      width: 240px;
      margin: 40px auto 36px;
    }

    .mic {
      width: 240px;
      height: 190px;
      display: block;
      overflow: visible;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .mic .body {
      transform-origin: 0 0;
      transform: translate(136px, 155px) rotate(-81deg);
    }

    .mic .shadow {
      transform-box: fill-box;
      transform-origin: center;
      opacity: .12;
    }

    .mic .wave,
    .mic .dust circle {
      transform-box: fill-box;
      transform-origin: center;
      opacity: 0;
    }

    .play .body   { animation: fall var(--dur) var(--delay) both; }
    .play .shadow { animation: shadow var(--dur) var(--delay) both; }
    .play .wave   { animation: wave .7s cubic-bezier(.2, .7, .3, 1) var(--impact) both; }
    .play .wave + .wave { animation-delay: calc(var(--impact) + .08s); }
    .play .dust circle { animation: dust .6s cubic-bezier(.2, .7, .3, 1) var(--impact) both; }
    main.play { animation: thud .35s ease-out var(--impact) both; }

    @keyframes fall {
      0%   { transform: translate(120px, 80px) rotate(0deg); opacity: 0;
             animation-timing-function: ease-out; }
      8%   { transform: translate(120px, 74px) rotate(-3deg); opacity: 1;
             animation-timing-function: ease-in-out; }
      22%  { transform: translate(120px, 76px) rotate(3deg);
             animation-timing-function: cubic-bezier(.55, 0, 1, .5); }
      50%  { transform: translate(128px, 136px) rotate(-50deg);
             animation-timing-function: cubic-bezier(.6, 0, 1, .6); }
      62%  { transform: translate(136px, 155px) rotate(-81deg);
             animation-timing-function: ease-out; }
      71%  { transform: translate(137px, 149px) rotate(-75deg);
             animation-timing-function: ease-in; }
      80%  { transform: translate(136px, 155px) rotate(-81deg);
             animation-timing-function: ease-out; }
      88%  { transform: translate(136px, 153px) rotate(-79deg);
             animation-timing-function: ease-in; }
      100% { transform: translate(136px, 155px) rotate(-81deg); opacity: 1; }
    }

    @keyframes shadow {
      0%, 22% { transform: scale(.35); opacity: .03; }
      62%     { transform: scale(1);   opacity: .14; }
      100%    { transform: scale(1);   opacity: .12; }
    }

    @keyframes wave {
      0%   { transform: scale(.2); opacity: .9; }
      100% { transform: scale(1.6); opacity: 0; }
    }

    @keyframes dust {
      0%   { transform: translate(0, 0) scale(1); opacity: .9; }
      100% { transform: translate(var(--dx), var(--dy)) scale(.4); opacity: 0; }
    }

    @keyframes thud {
      0%   { transform: translateY(0); }
      25%  { transform: translateY(4px); }
      50%  { transform: translateY(-2px); }
      75%  { transform: translateY(1px); }
      100% { transform: translateY(0); }
    }

    .again {
      position: absolute;
      right: -8px;
      bottom: 2px;
      font-size: .75rem;
      color: var(--muted);
      opacity: 0;
      pointer-events: none;
      transition: opacity .4s ease;
    }

    .stage.done .again { opacity: .7; }

    /* ---------- Links ---------- */

    nav {
      display: flex;
      justify-content: center;
      gap: 32px;
      flex-wrap: wrap;
    }

    nav a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      transition: color .2s ease;
    }

    nav a:hover, nav a:focus-visible { color: var(--fg); }
    nav svg { width: 18px; height: 18px; fill: currentColor; }

    @media (prefers-reduced-motion: reduce) {
      .play .body, .play .shadow, .play .wave, .play .dust circle, main.play { animation: none; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Hi, I'm Tehleel Mir<br><span>and I know how to code.</span></h1>

    <div class="stage">
      <svg class="mic" viewBox="0 0 240 190" role="img" aria-label="A microphone being dropped">
        <defs>
          <pattern id="mesh" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
            <path d="M0 0v5M0 0h5" stroke="#111" stroke-width=".9" opacity=".55"/>
          </pattern>
          <clipPath id="grille"><circle cx="0" cy="-58" r="24"/></clipPath>
        </defs>

        <!-- ground -->
        <ellipse class="shadow" cx="112" cy="172" rx="58" ry="4" fill="#111"/>
        <ellipse class="wave" cx="79" cy="171" rx="40" ry="7" fill="none" stroke="#111" stroke-width="1.5"/>
        <ellipse class="wave" cx="79" cy="171" rx="40" ry="7" fill="none" stroke="#111" stroke-width="1"/>
        <g class="dust" fill="#111">
          <circle cx="79" cy="168" r="2"   style="--dx:-34px; --dy:-22px"/>
          <circle cx="79" cy="168" r="1.5" style="--dx:-20px; --dy:-34px"/>
          <circle cx="79" cy="168" r="1.5" style="--dx:-46px; --dy:-8px"/>
          <circle cx="79" cy="168" r="2"   style="--dx:30px;  --dy:-26px"/>
          <circle cx="79" cy="168" r="1.5" style="--dx:16px;  --dy:-38px"/>
          <circle cx="79" cy="168" r="1.5" style="--dx:44px;  --dy:-10px"/>
        </g>

        <!-- the mic (local origin sits mid-body) -->
        <g class="body">
          <!-- handle -->
          <path d="M-13 -26 L13 -26 L6 40 Q0 45 -6 40 Z" fill="#111"/>
          <path d="M-7 -18 L-3 34" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".28"/>
          <rect x="-5" y="39" width="10" height="5" rx="1.5" fill="#444"/>
          <!-- collar + band -->
          <rect x="-16" y="-38" width="32" height="10" rx="3" fill="#222"/>
          <rect x="-14" y="-29" width="28" height="4" fill="#fff" stroke="#111" stroke-width="1.5"/>
          <!-- grille -->
          <circle cx="0" cy="-58" r="24" fill="#f4f4f4"/>
          <rect x="-24" y="-82" width="48" height="48" fill="url(#mesh)" clip-path="url(#grille)"/>
          <path d="M-24 -58 A24 7 0 0 0 24 -58" fill="none" stroke="#111" stroke-width="1.5"/>
          <path d="M-14 -72 A17 17 0 0 1 -4 -77" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
          <circle cx="0" cy="-58" r="24" fill="none" stroke="#111" stroke-width="2.5"/>
        </g>
      </svg>
      <span class="again">↻ again</span>
    </div>

    <nav>
      <a href="https://play.google.com/store/apps/dev?id=9086481429286206015&hl=en_IN" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.6 1.8c-.3.3-.5.8-.5 1.4v17.6c0 .6.2 1.1.5 1.4l.1.1 9.9-9.9v-.2L3.7 1.7l-.1.1zm13.3 13.4-3.3-3.3v-.2l3.3-3.3.1.1 3.9 2.2c1.1.6 1.1 1.7 0 2.3l-3.9 2.2h-.1zm-.1.1L13.4 12 3.6 21.8c.4.4 1 .4 1.6.1l11.6-6.6zm0-6.6L5.2 2.1c-.7-.4-1.3-.3-1.6.1l9.8 9.8 3.4-3.3z"/></svg>
        Play Store
      </a>
      <a href="https://github.com/TehleelMir" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .5C5.7.5.5 5.7.5 12c0 5.1 3.3 9.4 7.9 10.9.6.1.8-.3.8-.6v-2c-3.2.7-3.9-1.5-3.9-1.5-.5-1.3-1.3-1.7-1.3-1.7-1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.7-1.6-2.6-.3-5.3-1.3-5.3-5.7 0-1.3.5-2.3 1.2-3.1-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.3 1.2a11.5 11.5 0 0 1 6 0C17.3 4.6 18.3 5 18.3 5c.7 1.6.2 2.8.1 3.1.8.8 1.2 1.8 1.2 3.1 0 4.4-2.7 5.4-5.3 5.7.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6 4.6-1.5 7.9-5.8 7.9-10.9C23.5 5.7 18.3.5 12 .5z"/></svg>
        GitHub
      </a>
      <a href="https://www.linkedin.com/in/tehleel-mir-3a88b91bb/" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.4 20.5h-3.6v-5.6c0-1.3 0-3-1.8-3s-2.1 1.4-2.1 2.9v5.7H9.4V9h3.4v1.6c.5-.9 1.6-1.8 3.4-1.8 3.6 0 4.3 2.4 4.3 5.5v6.2zM5.3 7.4a2.1 2.1 0 1 1 0-4.2 2.1 2.1 0 0 1 0 4.2zm1.8 13.1H3.6V9h3.5v11.5zM22.2 0H1.8C.8 0 0 .8 0 1.7v20.6c0 .9.8 1.7 1.8 1.7h20.4c1 0 1.8-.8 1.8-1.7V1.7C24 .8 23.2 0 22.2 0z"/></svg>
        LinkedIn
      </a>
    </nav>
  </main>

  <script>
    (function () {
      var main = document.querySelector('main');
      var stage = document.querySelector('.stage');
      var mic = document.querySelector('.mic');
      var body = mic.querySelector('.body');

      function drop() {
        stage.classList.remove('done');
        mic.classList.remove('play');
        main.classList.remove('play');
        void mic.getBoundingClientRect(); // restart animations
        mic.classList.add('play');
        main.classList.add('play');
      }

      body.addEventListener('animationend', function () { stage.classList.add('done'); });
      mic.addEventListener('click', drop);
      drop();
    })();
  </script>
</body>
</html>
